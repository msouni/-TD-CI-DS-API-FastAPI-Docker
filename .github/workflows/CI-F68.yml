name: CI – FastAPI
 
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [FT*]
 
permissions:
  contents: read
 
jobs:
  linting:
    runs-on: ubuntu-24.04
    steps:
        # Runner infos
      - name: Runner infos
        run: |
          echo "Runner name : $RUNNER_NAME"
          echo "Runner OS   : $RUNNER_OS"
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Linting – qualité du code
      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
  type-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Runner infos
        run: |
          echo "Runner name : $RUNNER_NAME"
          echo "Runner OS   : $RUNNER_OS"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies & Mypy
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-requests
          # Install your application dependencies so mypy can read them
          pip install -r app/requirements.txt

      - name: Run Mypy
        run: mypy app
  test:
    runs-on: ubuntu-24.04
    needs: [linting, type-check]
    steps:
        # Runner infos
      - name: Runner infos
        run: |
          echo "Runner name : $RUNNER_NAME"
          echo "Runner OS   : $RUNNER_OS"
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Installer les dépendances dev
      - name: Install dependencies (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip list
       
      # Tests unitaires / async
      - name: Run tests
        run: |
          export PYTHONPATH=$(pwd)
          pytest --maxfail=1 --disable-warnings -q
    
  SafetyScan:
    runs-on: ubuntu-24.04
    needs: [test, type-check  ]
    steps:
        # Runner infos
      - name: Runner infos
        run: |
          echo "Runner name : $RUNNER_NAME"
          echo "Runner OS   : $RUNNER_OS"
      # Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4
      # Configurer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"        
       # Vérifier la sécurité des dépendances (optionnel)
      - name: Check for security issues
        run: |
          pip install safety
          safety check -r app/requirements.txt || true
